<!doctype html>
<!--
  Source for assets/img/og-card.png, the 1200x630 link-preview image used by
  LinkedIn, Slack, X, etc. (og:image / twitter:image).
  Regenerate from the project root after changing the photo or title:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --virtual-time-budget=4000 --window-size=1200,630 \
      --screenshot=assets/img/og-card.png "file://$PWD/documentation/og_card_source.html"
  Then bump the ?v=N on the og:image URLs so platforms refetch it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Source Serif 4', Georgia, serif;
    background: #ffffff;
    color: #1f2328;
    display: flex;
    align-items: center;
    gap: 64px;
    padding: 0 88px;
    box-sizing: border-box;
    border-bottom: 18px solid #002145;
  }
  img { width: 344px; height: 430px; object-fit: cover; border-radius: 14px; flex-shrink: 0; }
  h1 { margin: 0 0 18px; font-size: 76px; font-weight: 600; color: #002145; line-height: 1.05; }
  .role { margin: 0; font-size: 34px; color: #1f2328; }
  .aff { margin: 6px 0 0; font-size: 30px; color: #5a6270; line-height: 1.3; }
  hr { border: 0; border-top: 2px solid #d9dde3; margin: 30px 0 22px; width: 120px; }
  .url { margin: 0; font-size: 28px; color: #1c4f8c; }
</style>
</head>
<body>
  <img src="../assets/img/headshot.jpg" alt="">
  <div>
    <h1>César Landín</h1>
    <p class="role">Ph.D. Candidate in Economics</p>
    <p class="aff">Vancouver School of Economics<br>University of British Columbia</p>
    <hr>
    <p class="url">clandinq.github.io</p>
  </div>
</body>
</html>
